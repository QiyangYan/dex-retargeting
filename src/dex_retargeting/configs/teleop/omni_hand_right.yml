retargeting:
  type: vector
  urdf_path: omni_hand/omni_hand_right.urdf

  # target_joint_names: null
  target_joint_names: [ 'thumb_cmc_roll', 'thumb_cmc_yaw', 'thumb_cmc_pitch', 'thumb_mcp',
                        'index_mcp_roll', 'index_mcp_pitch', 'index_pip', 
                        'middle_mcp_roll', 'middle_mcp_pitch', 'middle_pip', 
                        'ring_mcp_pitch', 
                        'pinky_mcp_pitch']
  
  # target_origin_link_names: [ "hand_base_link", "hand_base_link", "hand_base_link", "hand_base_link", "hand_base_link", "hand_base_link", "hand_base_link", "hand_base_link", "hand_base_link", "hand_base_link" ]
  
  # target_task_link_names: [ "thumb_distal",  "index_distal", "middle_distal", "ring_distal", "pinky_distal",
  #                      "thumb_proximal",  "index_middle", "middle_middle", "ring_middle", "pinky_middle" ]
  
  target_origin_link_names: [ 
    "hand_base_link", "hand_base_link", "hand_base_link", "hand_base_link", "hand_base_link",
    "thumb_distal", "thumb_distal", "thumb_distal", "thumb_distal",
    "index_distal", "index_distal", "index_distal",
    "middle_distal", "middle_distal",
    "ring_distal",
  ]
  target_task_link_names: [ "thumb_distal",  "index_distal", "middle_distal", "ring_distal", "pinky_distal",
    "index_distal", "middle_distal", "ring_distal", "pinky_distal",
    "middle_distal", "ring_distal", "pinky_distal",
    "ring_distal", "pinky_distal",
    "pinky_distal"
  ]

  scaling_factor: 1.4 # 1.4 for mano to omni, 0.9 for shadow to omni
  
  target_link_human_indices: [ [ 0, 0, 0, 0, 0, 4, 4, 4, 4, 8, 8, 8, 12, 12, 16 ], [ 4, 8, 12, 16, 20, 8, 12, 16, 20, 12, 16, 20, 16, 20, 20] ]
  # target_link_human_indices: [ [ 0, 0, 0, 0, 0], [ 4, 8, 12, 16, 20 ] ]
  # [ 4, 8, 12, 16, 20, 2, 6, 10, 14, 18 ] 

  
  add_dummy_free_joint: True
  # A smaller alpha means stronger filtering, i.e. more smooth but also larger latency
  low_pass_alpha: 0.2

  canonical_frame: [[0, 1, 0], [-1, 0, 0], [0, 0, 1]]
